        // ==========================================
        // INIT PWA & UI HELPERS

        let deferredPrompt;
        window.initPWA = function() {
            // Injeksi Manifest Dinamis
            const manifestData = {
                "name": "RT Smart KUDEN",
                "short_name": "RT Smart",
                "start_url": window.location.href,
                "display": "standalone",
                "background_color": "#ffffff",
                "theme_color": "#1e3a8a",
                "icons": [{"src": "https://cdn-icons-png.flaticon.com/512/2190/2190328.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
            const manifestLink = document.getElementById('manifest-link');
            if (manifestLink) manifestLink.setAttribute('href', URL.createObjectURL(manifestBlob));

            // Service Worker
            if ('serviceWorker' in navigator) {
                try {
                    const swCode = `
                        const CACHE_NAME = 'rt-smart-v1';
                        self.addEventListener('install', event => self.skipWaiting());
                        self.addEventListener('activate', event => event.waitUntil(clients.claim()));
                        self.addEventListener('fetch', event => {
                            event.respondWith(fetch(event.request).catch(() => new Response("Offline Mode")));
                        });
                    `;
                    const blob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(blob);
                    navigator.serviceWorker.register(swUrl).catch(err => console.log('Info PWA: Service Worker diblokir.', err.message));
                } catch (e) { console.log("PWA gagal diinisiasi.", e); }
            }

            const installBtn = document.getElementById('btn-install-pwa');
            // Cek mode Standalone
            const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

            if (!isStandalone) {
                // Munculkan tombol jika belum standalone
                if (installBtn) installBtn.classList.remove('hidden');

                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    deferredPrompt = e;
                    if (installBtn) installBtn.classList.remove('hidden');
                });
            }

            window.addEventListener('appinstalled', () => {
                deferredPrompt = null;
                if (installBtn) installBtn.classList.add('hidden');
                window.showToast("Aplikasi berhasil diinstal!", "success");
            });
        };

        window.installPWA = function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') document.getElementById('btn-install-pwa').classList.add('hidden');
                    deferredPrompt = null;
                });
            } else {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    window.showToast("📱 Untuk iPhone: Ketuk ikon Share di bawah browser, lalu pilih 'Add to Home Screen'.", "info");
                } else {
                    window.showToast("Buka menu browser (titik tiga) lalu pilih 'Install Aplikasi' atau 'Tambahkan ke Layar Utama'.", "info");
                }
            }

                logoContainer.classList.add('bg-white');
            }
        };

            if(loader) {

        window.showConfirmModal = function(title, message, confirmCallback) {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            
            modal.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
            
            const btnCancel = document.getElementById('btn-confirm-cancel');
            const btnOk = document.getElementById('btn-confirm-ok');
            
            const newBtnCancel = btnCancel.cloneNode(true);
            const newBtnOk = btnOk.cloneNode(true);
            btnCancel.parentNode.replaceChild(newBtnCancel, btnCancel);
            btnOk.parentNode.replaceChild(newBtnOk, btnOk);
            
            const closeModal = () => {
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => modal.classList.add('hidden'), 200);
            };
            
            newBtnCancel.onclick = closeModal;
            newBtnOk.onclick = () => { closeModal(); confirmCallback(); };
        };

        window.showToast = function(message, type = 'success') {
            const toast = document.createElement('div');
            const icon = type === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : type === 'error' ? '<i class="fas fa-exclamation-circle text-red-500"></i>' : '<i class="fas fa-info-circle text-blue-500"></i>';
            const borderColor = type === 'success' ? 'border-green-100' : type === 'error' ? 'border-red-100' : 'border-blue-100';
            const barColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
            
            toast.className = `toast-enter flex items-center gap-3 bg-white border ${borderColor} shadow-xl rounded-xl p-4 min-w-[250px] max-w-sm pointer-events-auto relative overflow-hidden`;
            const progress = `<div class="absolute bottom-0 left-0 h-1 ${barColor} animate-[shrink_3s_linear_forwards]" style="width: 100%;"></div>`;
            
            toast.innerHTML = `<div class="text-2xl">${icon}</div><div class="flex-1 text-sm font-medium text-gray-700">${message}</div><button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button><style>@keyframes shrink { from { width: 100%; } to { width: 0%; } }</style>${progress}`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => { toast.classList.remove('toast-enter'); toast.classList.add('toast-exit'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        window.submitImportWarga = async function(e) {
            e.preventDefault();
            const file = document.getElementById('import_file').files[0];
            if(!file) return;

            const btn = document.getElementById('btn-process-import');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Memproses...'; btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
                    if(json.length === 0) throw new Error("Kosong");

                    let wBatch = [], uBatch = [];
                    const timeSeed = Date.now();

                    json.forEach((r, i) => {
                        if(r.namaLengkap && r.noRumah) {
                            let parsedTgl = '';
                            let tglRaw = r.tanggalLahir;
                            if(tglRaw) {
                                if(typeof tglRaw === 'number' || (!isNaN(tglRaw) && String(tglRaw).trim() !== '')) {
                                    const serial = Number(tglRaw);
                                    const jsDate = new Date(Math.round((serial - 25569) * 86400 * 1000));
                                    parsedTgl = jsDate.toISOString().split('T')[0];
                                } else if (typeof tglRaw === 'string') {
                                    const parts = tglRaw.split(/[\/\-]/);
                                    if (parts.length === 3) {
                                        if (parts[2].length === 4) parsedTgl = `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
                                        else if (parts[0].length === 4) parsedTgl = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                                        else parsedTgl = tglRaw;
                                    } else {
                                        parsedTgl = tglRaw;
                                    }
                                }
                            }

                            wBatch.push({ id: 'W_IMP' + timeSeed + i, noKk: String(r.noKk || ''), nik: String(r.nik || ''), namaLengkap: r.namaLengkap, noRumah: String(r.noRumah), jenisKelamin: r.jenisKelamin || 'Laki-laki', tempatLahir: r.tempatLahir || '', tanggalLahir: parsedTgl, agama: 'Islam', pekerjaan: r.pekerjaan || '', statusKeluarga: r.statusKeluarga || 'Lainnya', statusTinggal: r.statusTinggal || 'Tetap', noHp: String(r.noHp || '') });
                            uBatch.push({ id: 'U_IMP' + timeSeed + i, username: r.namaLengkap, password: "rt02oke", role: "warga", noRumah: String(r.noRumah), nama: r.namaLengkap });
                        }
                    });

                    window.showToast(`Mengirim ${wBatch.length} data...`, "info");
                    const res = await window.fetchApp('importWargaBatch', { wargaData: wBatch, usersData: uBatch });
                    if(res.success) { window.showToast("Import berhasil!", "success"); document.getElementById('modal-import-warga').classList.add('hidden'); window.loadMenu('warga'); }
                } catch(err) { window.showToast("Gagal baca file Excel.", "error"); }
                finally { btn.innerHTML = originalText; btn.disabled = false; }
            };

        window.handleSelectPeminjam = function(val) {
            if(!val) return;
            const match = val.match(/^(.*) \((.*)\)$/);
            if(match) {
                document.getElementById('pj_nama').value = match[1];
                document.getElementById('pj_rumah').value = match[2];
                document.getElementById('pj_nama').readOnly = true;
                document.getElementById('pj_rumah').readOnly = true;
                document.getElementById('pj_nama').classList.add('bg-gray-100', 'text-gray-500');
                document.getElementById('pj_rumah').classList.add('bg-gray-100', 'text-gray-500');
            } else {
                document.getElementById('pj_nama').value = val;
            }
        };

        window.viewDetailPeminjam = function(nama, noRumah) {
            const rawData = window.pinjamanDataGlobal.filter(p => p.namaPeminjam === nama && p.noRumah === noRumah);
            window.activePeminjam = { nama, noRumah };
            let tPinjam = 0, tAngsur = 0;
            let tbodyHtml = '';
            rawData.reverse().forEach(p => { 
                const val = Number(p.nominal);
                if(p.jenis === 'Pinjaman') tPinjam += val; else tAngsur += val;
                tbodyHtml += `
                    <tr class="hover:bg-gray-50 group">
                        <td class="p-3 align-top">
                            <div class="font-bold text-xs">${p.tanggal}</div>
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-md ${p.jenis === 'Pinjaman' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'} uppercase inline-block mt-1">${p.jenis}</span>
                        </td>
                        <td class="p-3 text-xs align-top">${p.keterangan || '-'}</td>
                        <td class="p-3 text-right font-bold align-top ${p.jenis === 'Pinjaman' ? 'text-rose-600' : 'text-emerald-600'}">
                            ${p.jenis === 'Pinjaman' ? '-' : '+'}${window.formatRp(p.nominal)}
                        </td>
                        ${currentUser.role === 'admin' ? `
                        <td class="p-3 text-center align-top opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
                            <button onclick="window.editTransaksiPinjaman('${p.id}')" class="text-blue-500 bg-blue-50 p-1.5 rounded mr-1" title="Edit Transaksi ini"><i class="fas fa-edit"></i></button>
                            <button onclick="window.deleteTransaksiPinjaman('${p.id}', '${nama}', '${noRumah}')" class="text-red-500 bg-red-50 p-1.5 rounded" title="Hapus Transaksi ini"><i class="fas fa-trash-alt"></i></button>
                        </td>` : ''}
                    </tr>
                `; 
            });

            let sisa = tPinjam - tAngsur;
            document.getElementById('detail_sisa_hutang').innerText = window.formatRp(sisa < 0 ? 0 : sisa);
            document.getElementById('detail_total_angsur').innerText = window.formatRp(tAngsur);
            document.getElementById('detail_title_nama').innerText = `${nama} (Blok ${noRumah})`;
            document.getElementById('detail_tbody').innerHTML = tbodyHtml;
            document.getElementById('modal-detail-peminjam').classList.remove('hidden');
        };

        window.openModalPinjaman = function() {
            document.getElementById('pj_id').value = '';
            document.getElementById('pj_tanggal').value = new Date().toISOString().split('T')[0]; 
            document.getElementById('pj_search_input').value = '';
            document.getElementById('pj_nama').value = '';
            document.getElementById('pj_rumah').value = ''; 
            document.getElementById('pj_nominal').value = ''; 
            document.getElementById('pj_ket').value = '';
            document.getElementById('pj_jenis').value = 'Pinjaman'; 
            
            document.getElementById('pj_nama').readOnly = false;
            document.getElementById('pj_rumah').readOnly = false;
            document.getElementById('pj_nama').classList.remove('bg-gray-100', 'text-gray-500');
            document.getElementById('pj_rumah').classList.remove('bg-gray-100', 'text-gray-500');
            
            document.getElementById('div_pilih_warga').classList.remove('hidden');
            document.getElementById('form_title_transaksi').innerText = 'Beri Pinjaman Baru';
            document.getElementById('btn-save-pinjaman').className = "w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl mt-2";
            document.getElementById('modal-pinjaman').classList.remove('hidden');

        window.openFormTranskasi = function(jenisTransaksi) {
            document.getElementById('pj_id').value = '';
            document.getElementById('pj_tanggal').value = new Date().toISOString().split('T')[0]; 
            document.getElementById('pj_nama').value = window.activePeminjam.nama; 
            document.getElementById('pj_rumah').value = window.activePeminjam.noRumah; 
            document.getElementById('pj_nominal').value = ''; 
            document.getElementById('pj_ket').value = '';
            document.getElementById('pj_jenis').value = jenisTransaksi;
            
            document.getElementById('pj_nama').readOnly = true;
            document.getElementById('pj_rumah').readOnly = true;
            document.getElementById('pj_nama').classList.add('bg-gray-100', 'text-gray-500');
            document.getElementById('pj_rumah').classList.add('bg-gray-100', 'text-gray-500');
            
            document.getElementById('div_pilih_warga').classList.add('hidden');
            document.getElementById('form_title_transaksi').innerText = jenisTransaksi;
            
            const btnSave = document.getElementById('btn-save-pinjaman');
            btnSave.innerText = "Simpan Transaksi";
            if(jenisTransaksi === 'Angsuran') btnSave.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl mt-2";
            else btnSave.className = "w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl mt-2";

            document.getElementById('modal-pinjaman').classList.remove('hidden');
        };

        window.editTransaksiPinjaman = function(id) {
            const pj = window.pinjamanDataGlobal.find(x => String(x.id) === String(id));
            if(!pj) return;
            document.getElementById('pj_id').value = pj.id;
            document.getElementById('pj_tanggal').value = pj.tanggal;
            document.getElementById('pj_nama').value = pj.namaPeminjam;
            document.getElementById('pj_rumah').value = pj.noRumah;
            document.getElementById('pj_jenis').value = pj.jenis;
            document.getElementById('pj_nominal').value = pj.nominal;
            document.getElementById('pj_ket').value = pj.keterangan || '';
            
            document.getElementById('pj_nama').readOnly = false;
            document.getElementById('pj_rumah').readOnly = false;
            document.getElementById('pj_nama').classList.remove('bg-gray-100', 'text-gray-500');
            document.getElementById('pj_rumah').classList.remove('bg-gray-100', 'text-gray-500');

            document.getElementById('div_pilih_warga').classList.add('hidden');

            const btnSave = document.getElementById('btn-save-pinjaman');
            btnSave.innerText = "Simpan Perubahan";
            if(pj.jenis === 'Angsuran') btnSave.className = "w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-2";

            document.getElementById('modal-detail-peminjam').classList.add('hidden'); 
            document.getElementById('modal-pinjaman').classList.remove('hidden');
        };

        window.deleteTransaksiPinjaman = function(id, nama, noRumah) {
            window.showConfirmModal("Hapus Transaksi", "Hapus transaksi ini dari riwayat?", () => {
                window.fetchApp('deletePinjaman', { id: String(id) }).then(res => {
                    if (res.success) { 
                        window.showToast("Dihapus!", "success"); 
                        window.fetchApp('getPinjaman').then(r => {
                            window.pinjamanDataGlobal = r.data || [];
                            window.viewDetailPeminjam(nama, noRumah);
                            window.loadMenu('pinjaman'); 
                        });
                    }
                });
            });
        };

        window.submitPinjaman = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-pinjaman');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            const id = document.getElementById('pj_id').value;
            const payload = { 
                tanggal: document.getElementById('pj_tanggal').value, 
                namaPeminjam: document.getElementById('pj_nama').value, 
                noRumah: document.getElementById('pj_rumah').value, 
                jenis: document.getElementById('pj_jenis').value, 
                nominal: document.getElementById('pj_nominal').value, 
                keterangan: document.getElementById('pj_ket').value 
            };

            const actionName = id ? 'updatePinjaman' : 'addPinjaman';
            const res = await window.fetchApp(actionName, { id: id, data: payload });
            if (res.success) { window.showToast("Tersimpan"); window.loadMenu('pinjaman'); }
            else { window.showToast(res.message, 'error'); btn.innerHTML = originalText; btn.disabled = false; }
        };

        window.editPeminjamGlobal = function(nama, rumah) {
            document.getElementById('edit_pj_old_nama').value = nama;
            document.getElementById('edit_pj_old_rumah').value = rumah;
            document.getElementById('edit_pj_new_nama').value = nama;
            document.getElementById('edit_pj_new_rumah').value = rumah;
            document.getElementById('modal-edit-peminjam').classList.remove('hidden');
        };

        window.submitEditPeminjamGlobal = async function(e) {
            e.preventDefault();
            const oldNama = document.getElementById('edit_pj_old_nama').value;
            const oldRumah = document.getElementById('edit_pj_old_rumah').value;
            const newNama = document.getElementById('edit_pj_new_nama').value;
            const newRumah = document.getElementById('edit_pj_new_rumah').value;

            const btn = document.getElementById('btn-save-edit-pj');
            btn.innerText = "Memproses..."; btn.disabled = true;

            window.fetchApp('updatePeminjamGlobal', { oldNama, oldBlok: oldRumah, newNama, newBlok: newRumah }).then(res => {
                if(res.success) {
                    window.showToast("Data diperbarui!", "success");
                    document.getElementById('modal-edit-peminjam').classList.add('hidden');
                    window.loadMenu('pinjaman');
                } else {
                    btn.innerText = "Update Semua Data"; btn.disabled = false;
                }
            });
        };

        window.deletePeminjamGlobal = function(nama, rumah) {
            window.showConfirmModal("Hapus Semua Riwayat", `Hapus seluruh riwayat transaksi milik ${nama}? Tindakan ini tidak bisa dibatalkan.`, () => {
                window.showToast("Menghapus data...", "info");
                window.fetchApp('deletePeminjamGlobal', { nama, blok: rumah }).then(res => {
                    if(res.success) { window.showToast("Semua riwayat terhapus!", "success"); window.loadMenu('pinjaman'); }
                });
            });
        };

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Pitutur Jawa / Judul (Opsional)</label><input type="text" id="slide_pitutur" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none text-sm"></div>
                                <div><label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-2">Arti / Sub-judul (Opsional)</label><input type="text" id="slide_arti" class="w-full p-3 bg-white border border-gray-200 rounded-xl outline-none text-sm"></div>
                            </div>
                            <div class="flex justify-end pt-2"><button type="submit" id="btn-add-slide" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 px-6 rounded-xl shadow-md transition text-sm"><i class="fas fa-cloud-upload-alt mr-2"></i>Upload Slide</button></div>
                        </form>

                        <h4 class="text-sm font-bold text-gray-700 mb-4"><i class="fas fa-list-ul mr-1"></i>Daftar Slide Aktif</h4>
                        <div class="space-y-3">
                            ${slides.length === 0 ? '<p class="text-sm text-gray-500 italic p-4 text-center border rounded-xl bg-gray-50">Belum ada gambar slide.</p>' : slides.map(s => `
                                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-3 border border-gray-200 rounded-xl bg-white gap-3 hover:shadow-sm transition-shadow">
                                    <div class="flex items-center gap-3 min-w-0 w-full">
                                        <div class="w-20 h-12 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0 border border-gray-200"><img src="${s.url}" class="w-full h-full object-cover"></div>
                                        <div class="min-w-0 flex-1">
                                            <p class="text-xs font-bold text-gray-800 truncate">${s.filename || 'Gambar Upload'}</p>
                                            ${s.pitutur ? `<p class="text-[10px] text-indigo-600 font-semibold truncate italic mt-0.5">"${s.pitutur}"</p>` : ''}
                                        </div>
                                    </div>
                                    <button onclick="window.handleDeleteSlideSetting('${s.id}')" class="w-full sm:w-auto text-red-500 hover:text-red-700 hover:bg-red-50 py-1.5 px-3 rounded-lg border border-transparent hover:border-red-200 transition text-xs font-bold flex-shrink-0">Hapus</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>` : ''}
                </div>
            `;
            document.getElementById('content-area').innerHTML = html;
        };

        window.handleUploadCustomSlide = async function(e) {
            e.preventDefault();
            const fileInput = document.getElementById('slide_file');
            if(!fileInput.files[0]) return;
            const btn = document.getElementById('btn-add-slide');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Mengunggah...'; btn.disabled = true;

            try {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
                img.src = URL.createObjectURL(fileInput.files[0]); await new Promise(res => img.onload = res);
                let width = img.width, height = img.height;
                if (width > 1000) { height = Math.round((height * 1000) / width); width = 1000; }
                canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
                const base64String = canvas.toDataURL('image/jpeg', 0.7);

                const payload = { filename: fileInput.files[0].name, pitutur: document.getElementById('slide_pitutur').value || '', arti: document.getElementById('slide_arti').value || '', url: base64String };
                const res = await window.fetchApp('addSlide', { data: payload });
                if (res.success) { window.showToast("Slide diunggah!"); window.loadMenu('setting'); } else { window.showToast(res.message, "error"); btn.innerHTML = originalText; btn.disabled = false; }
            } catch (err) { window.showToast("Gagal memproses gambar.", "error"); btn.innerHTML = originalText; btn.disabled = false; }
        };

        window.handleDeleteSlideSetting = function(id) {
            window.showConfirmModal("Hapus Slide", "Yakin ingin menghapus gambar slide ini dari sistem?", () => {
                window.fetchApp('deleteSlide', { id: String(id) }).then(res => { if (res.success) { window.showToast("Dihapus!", "success"); window.loadMenu('setting'); } });
            });
        };

        window.handleUpdateSetting = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save-setting'); btn.innerHTML = 'Menyimpan...'; btn.disabled = true;
            const newU = document.getElementById('set_username').value, newP = document.getElementById('set_password').value;
            const res = await window.fetchApp('updateProfile', { id: currentUser.id, username: newU, password: newP });
            if (res.success) { window.showToast("Profil diperbarui!"); if(newP) setTimeout(() => { window.logout(); }, 1500); else window.loadMenu('setting'); } 
            else { window.showToast(res.message, 'error'); btn.innerHTML = '<i class="fas fa-save mr-2"></i> Simpan Perubahan'; btn.disabled = false; }
        };

    </script>
</body>
</html>
